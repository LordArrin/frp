name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  check-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      frp_version: ${{ steps.check.outputs.frp_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if FRP_VERSION changed
        id: check
        run: |
          CURRENT_VERSION=$(grep "ARG FRP_VERSION" frpc/Dockerfile | head -1 | cut -d'=' -f2)
          
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git show HEAD^:frpc/Dockerfile > /tmp/old_dockerfile 2>/dev/null || true
            if [ -f /tmp/old_dockerfile ]; then
              OLD_VERSION=$(grep "ARG FRP_VERSION" /tmp/old_dockerfile | head -1 | cut -d'=' -f2)
              if [ "$CURRENT_VERSION" != "$OLD_VERSION" ]; then
                echo "Version changed from $OLD_VERSION to $CURRENT_VERSION"
                echo "version_changed=true" >> $GITHUB_OUTPUT
                echo "frp_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
              else
                echo "Version unchanged: $CURRENT_VERSION"
                echo "version_changed=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "First commit or cannot access previous version, building anyway"
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "frp_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "First commit, building anyway"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "frp_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version-change
    if: needs.check-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frpc
            context: ./frpc
            optimization: standard
          - service: frps
            context: ./frps
            optimization: standard
          - service: frpc-modern
            context: ./frpc
            optimization: modern
          - service: frps-modern
            context: ./frps
            optimization: modern
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version-change.outputs.frp_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPTIMIZATION=${{ matrix.optimization }}
          cache-from: type=gha
          cache-to: type=gha,mode=max